# HackTheSnackDB API configuration.
#
# Everything environment-specific is read from environment variables, so the
# same jar runs locally, in Docker and on Render. Defaults target a local
# PostgreSQL (see README: "Run locally").
#
# Database connection (pick one style):
#   DB_URL       full JDBC URL, e.g. jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME  database user (Supabase session pooler: postgres.<project-ref>)
#   DB_PASSWORD  database password
# or the libpq-style variables PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD / PGSSLMODE.
#
# CORS_ALLOWED_ORIGINS  comma-separated origin patterns allowed to call the API.

server:
  port: ${PORT:8087}
  servlet:
    context-path: /user-management
  shutdown: graceful

spring:
  application:
    name: hackthesnackdb-api
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}?sslmode=${PGSSLMODE:prefer}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: hackthesnack-pool
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 120000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # The schema is owned by src/main/resources/db/schema.sql (applied to
      # Supabase once). Hibernate only checks that the entities match it.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://danilomonge.github.io,http://localhost:*,http://127.0.0.1:*}
  # Keeps the free Render instance awake during the day by calling its own
  # public URL (see KeepAwakePinger). Empty = disabled (local runs, tests).
  keep-awake:
    url: ${KEEP_AWAKE_URL:}
    zone: ${KEEP_AWAKE_ZONE:Europe/Berlin}
    from-hour: ${KEEP_AWAKE_FROM_HOUR:6}
    until-hour: ${KEEP_AWAKE_UNTIL_HOUR:23}
    interval: PT10M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: HackTheSnackDB API
    version: "@project.version@"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: INFO
