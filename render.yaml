# Render Blueprint for the HackTheSnackDB API.
# The service is built from the Dockerfile in this repository and connects to
# the Supabase PostgreSQL database through the variables below (set the secret
# ones in the Render dashboard: Service -> Environment).
services:
  - type: web
    name: fakethesnackdb-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /user-management/actuator/health
    autoDeploy: true
    envVars:
      # Supabase -> Project -> Connect -> "Session pooler" (IPv4, port 5432):
      #   jdbc:postgresql://aws-<n>-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # Session pooler user: postgres.<project-ref>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://danilomonge.github.io,http://localhost:*,http://127.0.0.1:*
      # Nutrition dialog of the web app (/api/nutrition, /api/translate).
      - key: USDA_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      # The API pings this URL every 10 minutes from 06:00 to 23:00 Europe/Berlin
      # so the free instance does not spin down during the day (KeepAwakePinger).
      - key: KEEP_AWAKE_URL
        value: https://fakethesnackdb-api.onrender.com/user-management/actuator/health
