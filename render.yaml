# Render Blueprint for the HackTheSnackDB API.
# The service is built from the Dockerfile in this repository and connects to
# the Supabase PostgreSQL database through the variables below (set the secret
# ones in the Render dashboard: Service -> Environment).
services:
  - type: web
    name: fakethesnackdb-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /user-management/actuator/health
    autoDeploy: true
    envVars:
      # Supabase -> Project -> Connect -> "Session pooler" (IPv4, port 5432):
      #   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      # Session pooler user: postgres.<project-ref>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://danilomonge.github.io,http://localhost:*,http://127.0.0.1:*
