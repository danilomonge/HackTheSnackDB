# Backup wake-up for the free-tier services:
#  * The API keeps itself awake from 06:00 to 23:00 (Europe/Berlin) by pinging
#    its own URL (KeepAwakePinger, env KEEP_AWAKE_URL). This hourly run wakes it
#    in the morning (or after a restart) so that loop starts without waiting
#    for the first visitor. GitHub runs frequent schedules unreliably, which is
#    why the API does not depend on this workflow for the 10-minute pings.
#  * Every run also queries the database, so the free Supabase project is never
#    paused (it pauses after 7 days without activity).
# The last step re-enables this workflow so GitHub does not suspend the
# schedule after 60 days without commits.
name: Keep alive

on:
  schedule:
    - cron: "7 5-21 * * *" # hourly, 05:07-21:07 UTC
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://fakethesnackdb-api.onrender.com/user-management' }}
    steps:
      - name: Wake the API and touch the database
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 60 "$API_URL/actuator/health"; then
              echo
              curl -fsS --max-time 60 "$API_URL/product/list?page=1&size=1&name=" | head -c 300
              echo
              exit 0
            fi
            echo "API not ready yet (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
