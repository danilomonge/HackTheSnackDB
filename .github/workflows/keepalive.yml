# Keeps the free-tier services responsive:
#  * Daytime (05:03-21:53 UTC, i.e. about 06:00-23:00 in Germany): a ping every
#    10 minutes keeps the Render API from spinning down (it sleeps after 15 idle
#    minutes and then needs about a minute to start), so visitors never wait
#    for a cold start. That is ~17 h/day (~520 instance hours a month), inside
#    Render's 750 free hours per workspace with room left for the nutrition proxy.
#  * Every run also queries the database, so the free Supabase project is never
#    paused (it pauses after 7 days without activity).
# The last step re-enables this workflow so GitHub does not suspend the
# schedule after 60 days without commits.
name: Keep alive

on:
  schedule:
    - cron: "3-59/10 5-21 * * *" # every 10 minutes, 05:03-21:53 UTC
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://fakethesnackdb-api.onrender.com/user-management' }}
    steps:
      - name: Wake the API and touch the database
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 60 "$API_URL/actuator/health"; then
              echo
              curl -fsS --max-time 60 "$API_URL/product/list?page=1&size=1&name=" | head -c 300
              echo
              exit 0
            fi
            echo "API not ready yet (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          echo "API did not become healthy" >&2
          exit 1

      - name: Keep this scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
