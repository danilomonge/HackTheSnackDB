name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 17, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-java-user-management-pecus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run integration tests
        run: mvn -B verify

      - name: Build the Docker image
        working-directory: .
        run: docker build -t hackthesnackdb-api:ci .

  # Render does not receive push events for this repository, so CI triggers the
  # deploy itself once the tests pass on main. Set the repository secret
  # RENDER_DEPLOY_HOOK_URL (Render -> fakethesnackdb-api -> Settings -> Deploy Hook).
  deploy:
    name: Deploy to Render
    needs: test
    # Pushes to main deploy automatically; "Run workflow" on main redeploys by hand.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; deploy fakethesnackdb-api manually from the Render dashboard."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered for ${GITHUB_SHA::7}."
