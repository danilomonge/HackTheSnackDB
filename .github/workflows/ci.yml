name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 17, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-java-user-management-pecus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run integration tests
        run: mvn -B verify

      - name: Build the Docker image
        working-directory: .
        run: docker build -t hackthesnackdb-api:ci .
